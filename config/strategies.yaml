# 策略参数集中配置
# 每个策略都用唯一 id 命名，方便审计日志追溯哪个版本的策略下的单。

strategies:
  - id: ma_cross_v1
    class: qtrade.strategies.technical.ma_cross.MACrossStrategy
    enabled: true
    params:
      fast_window: 5
      slow_window: 20
      position_pct: 0.3       # 单标的最多占组合 30%
    universe:                  # 适用标的
      - "600519.SH"            # 贵州茅台
      - "000001.SZ"            # 平安银行

  - id: llm_multi_agent_v1
    class: qtrade.strategies.llm.graph.LLMMultiAgentStrategy
    enabled: false             # 默认关闭，调好后再打开
    params:
      # 实测 LLM 决策信心普遍在 0.40-0.55，0.6 阈值过严几乎不下单。
      # 0.45 让"温和但有方向"的决策能触发，更符合 LLM 的天然信心区间。
      decision_threshold: 0.45
      position_pct: 0.2
      prompt_version: v2         # 用 V2 prompts（多周期收益+相对指数+多轮辩论）
      debate_rounds: 2
    universe:
      - "600519.SH"
      - "000001.SZ"
