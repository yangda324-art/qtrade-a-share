[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qtrade"
version = "0.1.0"
description = "A 股 LLM 多 Agent 量化交易平台"
requires-python = ">=3.10"
authors = [{ name = "Da" }]
readme = "README.md"

# 依赖按职责分组，安装时一次装齐即可。
# 如果你想最小化首次安装体积，可以注释掉 ml/ui 后面再加回来。
dependencies = [
    # ---- 基础设施 ----
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "PyYAML>=6.0",
    "rich>=13.7",
    "typer>=0.12",                 # CLI 入口
    "tenacity>=8.2",               # 重试

    # ---- 数据 ----
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15.0",               # Parquet
    "duckdb>=0.10",                # 列存查询
    "akshare>=1.12",               # 免 API key 的 A 股数据源
    "requests>=2.31",
    "httpx>=0.27",

    # ---- 持久化 ----
    "SQLAlchemy>=2.0",
    "alembic>=1.13",

    # ---- 调度 ----
    "APScheduler>=3.10",
    "chinese-calendar>=1.9",       # 国内法定节假日，用于交易日历

    # ---- 策略 / 指标 ----
    "ta>=0.11",                    # 纯 Python 的技术指标库（无需编译）

    # ---- LLM ----
    "openai>=1.30",                # DeepSeek 兼容 OpenAI SDK
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",

    # ---- UI ----
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "plotly>=5.20",                # 回测报告
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
qtrade = "qtrade.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
